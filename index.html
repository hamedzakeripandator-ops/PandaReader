<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>PandaReader</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0e14;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      /* مرحلهٔ ۴۵ §۱: اسپلشِ فوریِ بوت — همه‌چیز اینلاین است تا از
         میلی‌ثانیهٔ صفر، پیش از لودِ جاوااسکریپت و استایل‌های برنامه،
         دیده شود. لایه، خواهرِ #root است (نه فرزندِ آن) تا مانتِ
         ری‌اکت آن را پاک نکند؛ App.jsx پس از اولین نقاشی آن را
         با انیمیشنِ ۲۵۰ میلی‌ثانیه‌ای محو و از DOM حذف می‌کند. */
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 35%, #131c28 0%, #0a0e14 75%);
        font-family: Tahoma, sans-serif;
        color: #e6edf3;
      }
      .cr-boot-logo-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cr-boot-ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid transparent;
        pointer-events: none;
      }
      .cr-boot-ring-a {
        width: 118px;
        height: 118px;
        border-top-color: #22d3ee;
        border-right-color: rgba(34, 211, 238, 0.25);
        animation: cr-spin 1.6s linear infinite;
      }
      .cr-boot-ring-b {
        width: 132px;
        height: 132px;
        border-top-color: #a78bfa;
        border-left-color: rgba(167, 139, 250, 0.25);
        animation: cr-spin 2.6s linear infinite reverse;
      }
      .cr-boot-logo {
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.45));
      }
      .cr-boot-title {
        font-size: 22px;
        font-weight: 700;
        color: #f0f6fc;
        text-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
      }
      .cr-boot-status {
        font-size: 13px;
        color: #9aa7b8;
        animation: cr-pulse 1.6s ease-in-out infinite;
      }
      .cr-boot-progress {
        width: 220px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .cr-boot-progress-fill {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #22d3ee, #a78bfa);
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
        animation: cr-boot-slide 1.4s ease-in-out infinite alternate;
      }
      @keyframes cr-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes cr-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes cr-boot-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(132px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-boot-splash" aria-hidden="true">
      <div class="cr-boot-logo-wrap">
        <div class="cr-boot-ring cr-boot-ring-a"></div>
        <div class="cr-boot-ring cr-boot-ring-b"></div>
        <svg class="cr-boot-logo" viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <path d="M48 26 C38 18 24 16 12 20 L12 70 C24 66 38 68 48 76 C58 68 72 66 84 70 L84 20 C72 16 58 18 48 26 Z" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round" />
          <path d="M48 26 L48 76" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" />
          <path d="M20 30 C28 28 38 29 44 33" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          <path d="M52 33 C58 29 68 28 76 30" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          <path d="M20 44 C28 42 38 43 44 47" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          <path d="M52 47 C58 43 68 42 76 44" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          <path d="M20 58 C28 56 38 57 44 61" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          <path d="M52 61 C58 57 68 56 76 58" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.7" />
        </svg>
      </div>
      <div class="cr-boot-title">PandaReader</div>
      <div class="cr-boot-status">در حال آماده‌سازی محیط مطالعه...</div>
      <div class="cr-boot-progress"><div class="cr-boot-progress-fill"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
